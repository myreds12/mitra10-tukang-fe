# =========================================================
# .github/workflows/deploy.yml  (taruh di repo tukang-fe)
# Jalan di self-hosted runner yang terpasang di server NEMESIS
# Memanggil scripts/deploy/auto-deploy-fe.ps1
# =========================================================

name: Deploy Frontend Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-fe-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: test
    runs-on: [self-hosted, windows]
    env:
      APP_DIR: "D:\\Applications\\tukang"
      BRANCH: "master"
      # Isi PM_NAME HANYA jika FE dijalankan via pm2 (misal next start).
      # Kalau FE statis di-serve IIS/nginx, kosongkan "".
      PM_NAME: ""

    steps:
      # Checkout dipakai supaya repo (termasuk folder scripts/deploy/)
      # ter-update di workspace runner. Script auto-deploy-fe.ps1
      # yang dipanggil di bawah ini yang nanti urus pull ke APP_DIR.
      - name: Checkout repo (ambil scripts/deploy terbaru)
        uses: actions/checkout@v4

      - name: Jalankan auto-deploy-fe.ps1
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "scripts\deploy\auto-deploy-fe.ps1"